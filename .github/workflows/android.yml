name: Android CI Build

# Triggers the workflow on push or pull request events for the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository code
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Set up the Java Development Kit (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle' # Caches gradle dependencies to speed up future builds

    # Step 3: Grant execute permission for the Gradle wrapper
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Step 4: Build the Debug APK
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # Step 5: Upload the generated APK as a downloadable artifact
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-debug-apk
        path: app/build/outputs
